services:
  postgres:
    image: postgres:16-alpine
    container_name: fpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: fpl
      POSTGRES_DB: fpl
    ports:
      - '5432:5432'
    volumes:
      - fpl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fpl -d fpl']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fpl-pgdata:
